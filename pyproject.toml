[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plugin-platform-admin-linux"
version = "0.8.1"  # the plugin's own release (CHANGELOG.md); the app shows it on the Plugins view
description = "Linux administration for Liminal: root's rights and how they are had, the services the framework relies on, the apps' systemd user units, the platform's at boot, the framework's processes."
readme = "README.md"
requires-python = ">=3.10"
# the library it plugs into (the machine kind: liminal_libs.machines, plugin API 2.2: what it attaches to, 1.49.0);
# 1.80.0: its Shell puts `sudo -n --` before a command run as root, so no word of `run --elevated`'s is read as sudo's
dependencies = ["liminal-libs>=1.80.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.entry-points."liminal.providers"]
admin-linux = "plugin_platform_admin_linux"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
